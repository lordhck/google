<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnuogle</title>
<meta name="description" content="Search the web with Gnuogle.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://google.lordhck.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gnuogle Search">
<meta property="og:title" content="Gnuogle">
<meta property="og:description" content="Search the web with Gnuogle.">
<meta property="og:url" content="https://google.lordhck.com/">
<meta property="og:image" content="https://google.lordhck.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gnuogle logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gnuogle">
<meta name="twitter:description" content="Search the web with Gnuogle.">
<meta name="twitter:image" content="https://google.lordhck.com/og.png">
<style>
  :root {
    --bg: #fff; --fg: #202124; --muted: #5f6368; --line: #dfe1e5;
    --btn: #f8f9fa; --accent: #1a73e8; --tip-bg: #202124; --tip-fg: #fff;
    --box: #fff; --box-hl: #fff; --hl-shadow: 0 1px 6px rgba(32,33,36,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #5f6368;
      --btn: #303134; --accent: #8ab4f8; --tip-bg: #e8eaed; --tip-fg: #202124;
      --box: #202124; --box-hl: #303134; --hl-shadow: 0 1px 6px #171717, 0 0 0 1px #5f6368;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }
  body.playing, body.playing * { cursor: none !important; }
  main {
    flex: 1; width: 100%; max-width: 584px; padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-top: -8vh;
  }
  .logo {
    font-family: "Product Sans", "Google Sans", "Poppins", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(64px, 18vw, 112px); font-weight: 500; letter-spacing: -0.04em;
    line-height: 1; margin: 0 0 32px; user-select: none; text-align: center;
  }
  .b { color: #4285f4; } .r { color: #ea4335; } .y { color: #fbbc05; } .g { color: #34a853; }
  .wrap { position: relative; width: 100%; }
  .box {
    width: 100%; display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: 24px; padding: 0 16px; height: 46px;
    background: var(--box); transition: box-shadow .2s, border-color .2s, background .2s;
  }
  .box:hover, .box:focus-within, .box.active { box-shadow: var(--hl-shadow); border-color: transparent; background: var(--box-hl); }
  .box { position: relative; }
  .box svg { flex: none; fill: var(--muted); }
  .caret {
    position: absolute; top: 50%; width: 1.5px; height: 20px; margin-top: -10px;
    background: var(--fg); display: none; animation: blink 1.06s steps(1) infinite;
  }
  .caret.typing { animation: none; }
  body.playing .box.active .caret { display: block; }
  @keyframes blink { 50% { opacity: 0; } }
  .box input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg);
    font: inherit; height: 100%; padding: 0 3px 0 0;
  }
  .bubble {
    position: absolute; left: 50%; bottom: calc(100% + 14px); z-index: 5;
    transform: translate(-50%, 6px) scale(.96); opacity: 0;
    background: var(--tip-bg); color: var(--tip-fg); padding: 12px 20px; border-radius: 10px;
    font-size: 17px; font-weight: 500; white-space: nowrap; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    transition: opacity .25s, transform .25s cubic-bezier(.2,.9,.3,1.3);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: var(--tip-bg);
  }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .buttons { display: flex; gap: 12px; margin-top: 28px; }
  button {
    background: var(--btn); color: var(--fg); border: 1px solid var(--btn);
    border-radius: 4px; padding: 0 16px; height: 36px; font: 14px system-ui, sans-serif;
    cursor: pointer; transition: filter .1s;
  }
  button:hover, button.hover { border-color: var(--line); box-shadow: 0 1px 1px rgba(0,0,0,.1); }
  button.pressed { filter: brightness(.88); }
  .result { margin-top: 28px; width: 100%; display: none; }
  .result.show { display: block; }
  .result .box input { color: var(--accent); }
  .hint { color: var(--muted); font-size: 14px; margin-top: 10px; text-align: center; min-height: 20px; }
  #cursor {
    position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: none;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); will-change: transform;
  }
  #cursor svg { position: absolute; left: 0; top: 0; transition: transform .09s; transform-origin: 10% 5%; }
  #cursor .arrow { left: -2.2px; top: -1.4px; }
  #cursor .hand { display: none; left: -9.75px; top: -2px; }
  #cursor.on-btn .arrow { display: none; }
  #cursor.on-btn .hand { display: block; }
  #cursor.down svg { transform: scale(.86); }
  .ripple {
    position: fixed; z-index: 19; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; border: 2px solid var(--accent); pointer-events: none;
    animation: ripple .45s ease-out forwards;
  }
  @keyframes ripple { from { transform: scale(.2); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
  footer { padding: 16px; font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div id="cursor">
  <svg class="arrow" width="24" height="24" viewBox="0 0 32 32">
    <path d="M3 2.6v22.2c0 .9 1.1 1.3 1.7.7l5-4.8 3.9 8.6c.3.6 1 .9 1.6.6l2.6-1.2c.6-.3.9-1 .6-1.6l-3.9-8.4h7.1c.9 0 1.3-1.1.7-1.7L4.7 1.9C4.1 1.3 3 1.7 3 2.6z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M5.2 6.1v13.6" stroke="#fff" stroke-opacity=".18" stroke-width="1" stroke-linecap="round"/>
  </svg>
  <svg class="hand" width="26" height="26" viewBox="0 0 32 32">
    <path d="M10 4.5a2 2 0 0 1 4 0V13a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v1.5a1.8 1.8 0 0 1 3.6 0V22c0 4.5-3 8-7.5 8h-2.6c-2.6 0-4.5-1.2-6-3.2L3.8 19c-.9-1.2-.6-2.8.6-3.5 1.1-.7 2.5-.4 3.4.5l2.2 2.2z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M14 13v4.6M18 14v4.2M22 15.5v3.7" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
</div>

<main>
  <div class="logo" aria-label="Gnuogle"><span class="b">G</span><span class="r">n</span><span class="y">u</span><span class="b">o</span><span class="g">g</span><span class="r">l</span><span class="y">e</span></div>

  <div class="wrap">
    <div class="bubble" id="bubble"></div>
    <form class="box" id="form" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" name="q" type="text" placeholder="Type a question, get a link" autofocus>
      <span class="caret" id="caret"></span>
    </form>
  </div>

  <div class="buttons">
    <button id="search" type="submit" form="form">Gnuogle Search</button>
    <button id="lucky" type="button">I'm Feeling Lucky</button>
  </div>

  <div class="result" id="result">
    <div class="box">
      <input id="link" type="text" readonly>
      <button id="copy" type="button">Copy</button>
    </div>
    <div class="hint" id="hint">Share this link with whoever asked.</div>
  </div>
</main>

<footer>Not affiliated with Google. · <a href="https://lordhck.com">lordhck.com</a></footer>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const query = (params.get("q") || "").trim();
const searchUrl = q => "https://www.google.com/search?q=" + encodeURIComponent(q);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cursor = $("cursor");
let cx = 0, cy = 0;

function place(x, y) {
  cx = x; cy = y;
  cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
}

function bubble(text) {
  const b = $("bubble");
  b.classList.remove("show");
  if (!text) return Promise.resolve();
  return sleep(text && b.textContent ? 180 : 0).then(() => {
    b.textContent = text;
    b.classList.add("show");
  });
}

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function glide(tx, ty) {
  const sx = cx, sy = cy;
  const dx = tx - sx, dy = ty - sy;
  const dist = Math.hypot(dx, dy);
  const dur = Math.min(1400, Math.max(550, dist * 1.6));
  const bend = Math.min(90, dist * 0.18) * (dx > 0 ? -1 : 1);
  const mx = sx + dx / 2 - (dy / (dist || 1)) * bend;
  const my = sy + dy / 2 + (dx / (dist || 1)) * bend;
  return new Promise(done => {
    const t0 = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - t0) / dur), e = ease(t), u = 1 - e;
      place(u * u * sx + 2 * u * e * mx + e * e * tx, u * u * sy + 2 * u * e * my + e * e * ty);
      t < 1 ? requestAnimationFrame(step) : done();
    })(t0);
  });
}

async function click() {
  cursor.classList.add("down");
  const r = document.createElement("div");
  r.className = "ripple";
  r.style.left = cx + "px";
  r.style.top = cy + "px";
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 500);
  await sleep(140);
  cursor.classList.remove("down");
}

const measure = document.createElement("canvas").getContext("2d");

function moveCaret() {
  const input = $("q"), caret = $("caret");
  measure.font = getComputedStyle(input).font;
  const w = measure.measureText(input.value).width;
  const x = input.offsetLeft + Math.min(w - input.scrollLeft, input.clientWidth);
  caret.style.left = x + "px";
}

async function play(q) {
  const input = $("q"), box = $("form"), btn = $("search");
  input.removeAttribute("autofocus");
  input.blur();
  input.readOnly = true;
  input.placeholder = "";
  document.body.classList.add("playing");

  place(innerWidth * 0.82, innerHeight * 0.88);
  cursor.style.display = "block";
  await sleep(500);

  await bubble("Step 1: Type in your question");
  const ib = input.getBoundingClientRect();
  await glide(ib.left + Math.min(60, ib.width * 0.25), ib.top + ib.height / 2 - 4);
  await sleep(150);
  await click();
  moveCaret();
  box.classList.add("active");
  await sleep(500);

  $("caret").classList.add("typing");
  for (const ch of q) {
    input.value += ch;
    input.scrollLeft = input.scrollWidth;
    moveCaret();
    await sleep(ch === " " ? 140 : 55 + Math.random() * 95);
  }
  $("caret").classList.remove("typing");
  await sleep(600);

  await bubble("Step 2: Click the search button");
  const bb = btn.getBoundingClientRect();
  await glide(bb.left + bb.width / 2, bb.top + bb.height / 2);
  cursor.classList.add("on-btn");
  btn.classList.add("hover");
  await sleep(350);
  btn.classList.add("pressed");
  await click();
  btn.classList.remove("pressed");

  await bubble("Was that so hard?");
  await sleep(1800);
  location.href = searchUrl(q);
}

function makeLink(q) {
  return location.origin + location.pathname + "?q=" + encodeURIComponent(q).replace(/%20/g, "+");
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (document.body.classList.contains("playing")) return;
  const q = $("q").value.trim();
  if (!q) return;
  $("link").value = makeLink(q);
  $("result").classList.add("show");
  $("hint").textContent = "Share this link with whoever asked.";
  $("link").select();
});

$("q").addEventListener("input", e => {
  $("form").classList.toggle("active", !!e.target.value.trim());
});

$("lucky").addEventListener("click", () => {
  const q = $("q").value.trim();
  if (q) location.href = searchUrl(q);
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("link").value);
  } catch {
    $("link").select();
    document.execCommand("copy");
  }
  $("hint").textContent = "Copied!";
});

if (query) {
  document.title = query + " - Gnuogle Search";
  play(query);
}
</script>
</body>
</html>
